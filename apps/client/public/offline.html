<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sem internet</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center;
        background: #ffffff; color: #1f1f1f;
      }
      @media (prefers-color-scheme: dark) { body { background: #0b0b0b; color: #f2f2f2; } p { color: #b5b5b5; } }
      main { max-width: 380px; }
      .icone { font-size: 48px; line-height: 1; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: #5c5c5c; line-height: 1.5; margin: 0 0 24px; }
      a {
        display: inline-block; padding: 12px 24px; border-radius: 999px; background: #5c6e5a; color: #ffffff;
        font-weight: 700; text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icone" aria-hidden="true">📶</div>
      <h1>Você está sem internet</h1>
      <p>Assim que a conexão voltar, as suas aulas, provas e certificados estarão aqui de novo.</p>
      <a href="/dashboard">Tentar de novo</a>
    </main>
  </body>
</html>
